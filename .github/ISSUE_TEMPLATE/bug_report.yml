name: Bug 反馈
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填完整，尤其是复现步骤和设备信息。
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么？你期望发生什么？
      placeholder: 点击 FAB 后表单没有预填上次参数，期望预填。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开豆刻
        2. 已有至少一条冲煮记录
        3. 点击右下角 FAB
        4. 观察到 ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与系统
      placeholder: 红米 Note 12 / Android 13
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、日志、是否暗黑模式等
    validations:
      required: false
