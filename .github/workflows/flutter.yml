name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支上连续推送时，取消上一次还没跑完的运行，避免排队浪费额度。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 依赖源必须与 pubspec.lock 里记录的一致。
#
# lock 里的包来自中国镜像（开发机的 PUB_HOSTED_URL）。若 CI 用默认的 pub.dev，
# pub 会认为这些 lock 条目来自「别的源」而**重新解析**，于是绕过 lock 中钉住的
# 版本 —— 实测后果是解析到 analyzer 14.5.0，它移除了 build_runner 2.16.1 依赖的
# 一个 setter，导致「Generate Drift code」这一步直接编译失败。
# 指定同一个源后，CI 会照 lock 原样安装（= 本地验证过的那一套版本）。
env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-apk:
    name: Build APK
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: beanclick-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
